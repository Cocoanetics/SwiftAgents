---
name: Platform Probe

# Diagnostic workflow, intentionally separate from swift.yml so it can never
# affect the required Swift checks. It validates that SwiftAgents builds on
# Windows and Android — the two platforms swift.yml omits.
#
# The original blocker was NOT swift-nio (which builds fine on both under
# Swift 6.3) but SwiftMCP's client SSE code using `#if os(Linux)` where it
# meant `canImport(FoundationNetworking)`, routing Android/Windows down the
# Darwin `URLSession.AsyncBytes` path. Fixed on SwiftMCP `main` (commit
# 011775f); SwiftAgents tracks that branch (see Package.swift).
#
# We build the `SwiftAgents` umbrella TARGET (Providers + Agents + Tracing,
# plus the SwiftMCP library) rather than a product: `swift build --product`
# is ignored for automatic library products ("building the default target
# instead") and ends up compiling SwiftMCP's demo executables, which carry
# their own unrelated Android signal gap (`SIG_IGN`). `--target` scopes the
# build to exactly what SwiftAgents ships. (VectorStore/TerminalUI/Coder are
# Apple-/Process-oriented and out of scope for this cross-platform probe.)
#
# Jobs are allowed to fail (continue-on-error) so a red probe never blocks
# the PR. Once green and SwiftMCP tags a release with the fix, fold these
# into swift.yml as real jobs and delete this file.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel an in-progress probe when the branch is pushed again — these are
# expensive Windows/Android cold builds and only the latest commit matters.
concurrency:
  group: platform-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:

  probe-windows:
    # swift-nio is no longer in SwiftAgents' graph (we link only SwiftMCP's
    # `Client` trait), so Windows compiles again — this runs on every PR/push.
    # Kept continue-on-error while we shake out any remaining Windows-only
    # portability gaps in our own code; flip to a gating job (and fold into
    # swift.yml) once it's reliably green.
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3.1"
      - name: Verify Swift version
        run: swift --version
      - name: Build SwiftAgents (Windows)
        shell: pwsh
        run: swift build -v --target SwiftAgents

  probe-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true  # diagnostic — see probe-windows
    steps:
      - uses: actions/checkout@v6
      - name: Build SwiftAgents (Android)
        uses: skiptools/swift-android-action@v2
        with:
          # Full patch version so host toolchain and Android SDK tarballs
          # match (skiptools guidance — a floating "6.3" key drifts them).
          swift-version: "6.3.2"
          free-disk-space: true
          build-tests: false
          run-tests: false
          swift-build-flags: --target SwiftAgents
