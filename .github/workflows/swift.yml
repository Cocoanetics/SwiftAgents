---
name: Swift
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel superseded runs on the same ref — the Windows/Android cold builds
# below are expensive and only the latest commit on a branch matters.
concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # Pin Xcode 26.4.1 to pick up Swift 6.3-era Swift Testing fixes.
      # The macOS 15 runner image only carries Xcode up to 26.3, while
      # the macOS 26 image carries 26.4.1 plus a 26.5 beta. The newer
      # toolchain fixed the GoogleThinkingConfigTests hang on `main`
      # (run 25969761285) — the previous failure on Xcode 26.0 looked
      # like a pre-6.3 Swift Testing buffering / dispatch issue.
      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"
      - name: Verify Swift version
        run: swift --version
      - name: Build (macOS)
        run: swift build --build-tests -v
      - name: Test (macOS)
        # 5-min step ceiling: passing runs finish in under a minute, so
        # this fails fast on a hang instead of consuming the full
        # job budget.
        timeout-minutes: 5
        run: swift test -v --skip-build
      - name: Test SQLiteVectorStore (macOS)
        # The opt-in SQLite store: vec0/FTS5/hybrid + provenance, plus the
        # on-device NLContextualEmbedding path (Apple-only). The asset
        # downloads on a fresh runner, so allow extra time rather than a tight
        # ceiling. The OpenAI test skips without OPENAI_API_KEY.
        timeout-minutes: 14
        run: swift test -v --traits SQLiteVectorStore --filter SQLiteVectorStoreTests

  build-ios:
    # Compile-only check on `generic/platform=iOS`. The `Coder` executable
    # and `TerminalUI` use `Process()` which isn't available on iOS, so
    # only the `Providers` and `SemanticStore` libraries are built — those
    # are the surfaces iBash consumes.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"
      # `-skipMacroValidation` opts out of the Xcode 15+ macro trust
      # prompt — without it, builds of any package that ships Swift
      # macros (here: SwiftMCPMacros via the SwiftMCP dependency) fail
      # with `Macro "SwiftMCPMacros" from package "SwiftMCP" must be
      # enabled before it can be used`. CI doesn't have a human to
      # click the prompt.
      - name: Build Providers (iOS)
        run: |
          xcodebuild -scheme Providers \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            build
      - name: Build SemanticStore (iOS)
        run: |
          xcodebuild -scheme SemanticStore \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            build

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: swift --version
      # Build the products SwiftAgents actually ships, one at a time.
      # `swift build --build-tests` (which is what a single
      # `swift test --build-tests` would also trigger) pulls in
      # SwiftMCP's `SwiftMCPAggregatorTool` build-tool target as a
      # host executable, and under Linux Swift 6.3.1 + SwiftPM that
      # races its own swift-syntax host build (`error: no such module
      # 'SwiftSyntax'`). The race doesn't reproduce on macOS or when
      # products are built one at a time. SwiftAgents doesn't use the
      # aggregator plugin, so building the named products is
      # equivalent verification.
      - name: Build (Linux)
        run: |
          swift build -v --product Providers
          swift build -v --product SemanticStore
          swift build -v --product TerminalUI
          swift build -v --product Coder
      # MIME tests previously failed on Linux because `URL.mimeType()`
      # short-circuited to `application/octet-stream` without
      # `UniformTypeIdentifiers`. That's now covered by the homegrown
      # `UTType` shim in `Providers/Support/UTType+LinuxCompat.swift`,
      # so we run the test suite here too.
      - name: Test (Linux)
        timeout-minutes: 5
        run: swift test -v --filter ProvidersTests
      - name: Test SQLiteVectorStore (Linux)
        # vec0 + FTS5 compile on Linux; the stub-embedder tests run, the NL
        # test compiles out (no NaturalLanguage), the OpenAI test skips.
        timeout-minutes: 10
        run: swift test -v --traits SQLiteVectorStore --filter SQLiteVectorStoreTests

  build-windows:
    # swift-nio (whose Windows port doesn't compile) is out of the graph —
    # SwiftAgents links only SwiftMCP's NIO-free `Client` trait — so Windows
    # builds. We build the `SwiftAgents` umbrella TARGET, not a product:
    # `swift build --product` is ignored for automatic library products and
    # ends up compiling SwiftMCP's demo executables, which carry their own
    # unrelated Windows gaps. `--target` scopes the build to what we ship.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3.1"
      - name: Verify Swift version
        run: swift --version
      - name: Build SwiftAgents (Windows)
        shell: pwsh
        run: swift build -v --target SwiftAgents
      - name: Test (Windows)
        shell: pwsh
        timeout-minutes: 15
        # `swift test --filter` builds only the ProvidersTests dependency
        # graph (not SwiftMCP's demo executables), then runs the offline
        # subset; the key-gated live-API tests skip without secrets.
        run: swift test -v --filter ProvidersTests
      - name: Test SQLiteVectorStore (Windows)
        # vec0 + FTS5 compile from the vendored amalgamation (no system sqlite
        # / vcpkg). Stub-embedder tests run; NL compiles out, OpenAI skips.
        shell: pwsh
        timeout-minutes: 25
        run: swift test -v --traits SQLiteVectorStore --filter SQLiteVectorStoreTests

  build-android:
    # Cross-compiles ProvidersTests under the Android SDK via skiptools and
    # runs the offline subset in an emulator (key-gated live-API tests skip
    # without secrets). skiptools builds with `swift build --build-tests`,
    # which is mutually exclusive with `--target`; ProvidersTests is the only
    # test target, so the build already covers just it + its library graph
    # (not SwiftMCP's demo executables). `--filter ProvidersTests` scopes the
    # emulator run. Android also relied on SwiftMCP's `os(Linux)` →
    # `canImport(FoundationNetworking)` client fix (NIO itself builds here).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Build & test SwiftAgents (Android)
        uses: skiptools/swift-android-action@v2
        with:
          # Full patch version so host toolchain and Android SDK tarballs
          # match (skiptools guidance — a floating "6.3" key drifts them).
          swift-version: "6.3.2"
          free-disk-space: true
          build-tests: true
          run-tests: true
          # Build with the SQLiteVectorStore trait so the vec0 + FTS5 store
          # compiles for Android and its stub-embedder tests run in the
          # emulator (NL compiles out; the OpenAI test skips without a key).
          swift-build-flags: --traits SQLiteVectorStore
          swift-test-flags: --traits SQLiteVectorStore --filter ProvidersTests
