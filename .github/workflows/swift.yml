---
name: Swift
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # Pin Xcode 26.0 so the toolchain matches the iOS job and matches
      # what the Cocoanetics SwiftMail / ShellKit workflows use.
      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Verify Swift version
        run: swift --version
      - name: Build (macOS)
        run: swift build --build-tests -v
      # Pure-offline test suites only. `LocalVectorStoreTests` is
      # dropped from the filter — its only Apple-relevant test
      # (`contextualEmbeddingProvider`) needs `NLContextualEmbedding`
      # which downloads a model from Apple servers on first use and
      # fresh GitHub runners have no cache, which hung the test step
      # for 8+ minutes in earlier runs. The model is also tied to
      # API keys that public CI doesn't have, so the test gives us
      # no useful signal on this runner.
      - name: Test (macOS)
        run: |
          swift test -v --skip-build \
            --filter ArrayVectorTests \
            --filter TracingTests \
            --filter GoogleGenerateContentResponseTests \
            --filter GoogleThinkingConfigTests

  build-ios:
    # Compile-only check on `generic/platform=iOS`. The `Coder` executable
    # and `TerminalUI` use `Process()` which isn't available on iOS, so
    # only the `Providers` and `VectorStore` libraries are built — those
    # are the surfaces iBash consumes.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      # `-skipMacroValidation` opts out of the Xcode 15+ macro trust
      # prompt — without it, builds of any package that ships Swift
      # macros (here: SwiftMCPMacros via the SwiftMCP dependency) fail
      # with `Macro "SwiftMCPMacros" from package "SwiftMCP" must be
      # enabled before it can be used`. CI doesn't have a human to
      # click the prompt.
      - name: Build Providers (iOS)
        run: |
          xcodebuild -scheme Providers \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            build
      - name: Build VectorStore (iOS)
        run: |
          xcodebuild -scheme VectorStore \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            build

  build-linux:
    # Linux: full build + test. `VectorStore` is universal except for
    # `ContextualEmbeddingProvider` and `TextChunker` which are
    # `#if canImport(NaturalLanguage)`-gated; on Linux those compile to
    # empty, the rest of the target (Vector math, LocalVectorStore,
    # OpenAI / Ollama EmbeddingProvider bridges) builds and tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: swift --version
      - name: Build (Linux)
        run: swift build --build-tests -v
      # Same offline filter as macOS.
      - name: Test (Linux)
        run: |
          swift test -v --skip-build \
            --filter ArrayVectorTests \
            --filter TracingTests \
            --filter GoogleGenerateContentResponseTests \
            --filter GoogleThinkingConfigTests

  build-windows:
    # Windows: full build + test. Same shape as Linux — the package has
    # no C-library deps that would need vcpkg.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3.1"
      - name: Verify Swift version
        run: swift --version
      - name: Build (Windows)
        shell: pwsh
        run: swift build --build-tests -v
      - name: Test (Windows)
        shell: pwsh
        run: |
          swift test -v --skip-build `
            --filter ArrayVectorTests `
            --filter TracingTests `
            --filter GoogleGenerateContentResponseTests `
            --filter GoogleThinkingConfigTests

  # skiptools/swift-android-action wraps the swift.org Android SDK
  # setup AND runs SwiftPM tests on an x86_64 Android emulator. No
  # `container:` here — the emulator setup needs nested KVM, which
  # only works on the bare ubuntu-* runner image.
  build-android:
    runs-on: ubuntu-latest
    # First cold run = ~25 min (SDK + NDK + emulator boot dominates);
    # cached subsequent runs are ~5 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build & Test (Android emulator)
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: "6.3"
          # The default Linux runner has ~14 GiB free; the SDK, NDK,
          # and emulator together push past that without cleanup.
          free-disk-space: true
