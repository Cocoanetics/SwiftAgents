---
name: Swift
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-macos:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # Pin Xcode 26.4.1 to pick up Swift 6.3-era Swift Testing fixes.
      # The macOS 15 runner image only carries Xcode up to 26.3, while
      # the macOS 26 image carries 26.4.1 plus a 26.5 beta. The newer
      # toolchain fixed the GoogleThinkingConfigTests hang on `main`
      # (run 25969761285) — the previous failure on Xcode 26.0 looked
      # like a pre-6.3 Swift Testing buffering / dispatch issue.
      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"
      - name: Verify Swift version
        run: swift --version
      - name: Build (macOS)
        run: swift build --build-tests -v
      # Pure-offline test suites only. `LocalVectorStoreTests` is
      # dropped from the filter — its only Apple-relevant test
      # (`contextualEmbeddingProvider`) needs `NLContextualEmbedding`
      # which downloads a model from Apple servers on first use and
      # fresh GitHub runners have no cache, which hung the test step
      # for 8+ minutes in earlier runs. The model is also tied to
      # API keys that public CI doesn't have, so the test gives us
      # no useful signal on this runner.
      - name: Test (macOS)
        # Run each filter in its own `swift test` invocation so the log
        # shows progress per suite. Swift Testing buffers its output
        # within a single run, so one slow / hung suite would otherwise
        # hide the others. The shell loop also surfaces a banner before
        # each suite so the GitHub Actions log shows where time is
        # being spent, since previous runs failed with no Swift Testing
        # output making it through the buffering. Also captures each
        # suite's stdout+stderr to a per-suite log file that's
        # uploaded as a `macos-test-logs` artifact in the next step —
        # the inline `swift test` output also gets buffered by macOS's
        # libsystem if a suite hangs, but the file is flushed by the
        # `tee` line buffer so the artifact still has whatever did
        # get printed before the timeout.
        run: |
          set +e
          mkdir -p test-logs
          fail=0
          for suite in \
            ArrayVectorTests \
            TracingTests \
            GoogleGenerateContentResponseTests \
            GoogleThinkingConfigTests; do
            echo "::group::Test ${suite}"
            date "+>>> ${suite} start: %FT%T"
            swift test -v --skip-build --filter "${suite}" 2>&1 \
              | tee "test-logs/${suite}.log"
            rc=${PIPESTATUS[0]}
            date "+>>> ${suite} end:   %FT%T (rc=${rc})"
            echo "::endgroup::"
            if [ "${rc}" -ne 0 ]; then fail=1; fi
          done
          echo "fail=${fail}" > test-logs/_summary
          exit "${fail}"
      - name: Upload macOS test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-logs
          path: test-logs/
          if-no-files-found: warn

  build-ios:
    # Compile-only check on `generic/platform=iOS`. The `Coder` executable
    # and `TerminalUI` use `Process()` which isn't available on iOS, so
    # only the `Providers` and `VectorStore` libraries are built — those
    # are the surfaces iBash consumes.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"
      # `-skipMacroValidation` opts out of the Xcode 15+ macro trust
      # prompt — without it, builds of any package that ships Swift
      # macros (here: SwiftMCPMacros via the SwiftMCP dependency) fail
      # with `Macro "SwiftMCPMacros" from package "SwiftMCP" must be
      # enabled before it can be used`. CI doesn't have a human to
      # click the prompt.
      - name: Build Providers (iOS)
        run: |
          xcodebuild -scheme Providers \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            build
      - name: Build VectorStore (iOS)
        run: |
          xcodebuild -scheme VectorStore \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            build

  build-linux:
    # Linux: full build + test. `VectorStore` is universal except for
    # `ContextualEmbeddingProvider` and `TextChunker` which are
    # `#if canImport(NaturalLanguage)`-gated; on Linux those compile to
    # empty, the rest of the target (Vector math, LocalVectorStore,
    # OpenAI / Ollama EmbeddingProvider bridges) builds and tests.
    #
    # Run inside the official `swift:6.1-jammy` container — SwiftMCP
    # 1.4.5 requires `swift-tools-version: 6.1`, and the Swift toolchain
    # currently pre-installed on `ubuntu-latest` is 6.0.x, which fails
    # dependency resolution with: `'swiftmcp' >= 1.4.2 contains
    # incompatible tools version (6.1.0)`.
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: swift --version
      - name: Build (Linux)
        run: swift build --build-tests -v
      # Same offline filter as macOS.
      - name: Test (Linux)
        run: |
          swift test -v --skip-build \
            --filter ArrayVectorTests \
            --filter TracingTests \
            --filter GoogleGenerateContentResponseTests \
            --filter GoogleThinkingConfigTests

  # Windows and Android jobs are intentionally not present. SwiftMCP
  # transitively depends on swift-nio, whose Windows port has open
  # compile errors against current toolchains (`IPPROTO` /
  # `BinaryFloatingPoint`, non-Sendable `NIOLockedValueBox<…>`,
  # `UnsafeMutableRawPointer` Sendable unavailable in
  # `NIOPosix/ThreadWindows.swift`). Android via
  # `skiptools/swift-android-action` hits the same NIO wall once
  # SwiftMCP's libc-shim work (Cocoanetics/SwiftMCP#120) lets the
  # build progress past `String+Hostname.swift`. Re-add these jobs
  # once swift-nio has a clean Windows / Android story.
