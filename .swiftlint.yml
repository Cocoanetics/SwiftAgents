included:
  - Sources
  - Tests
  # Coder moved from Sources/Coder to Examples/Coder but is still a SPM
  # product — keep it under the same lint rules as the package sources.
  - Examples/Coder

excluded:
  # Test fixtures (JSON / PNG / text payloads bundled as test resources).
  - Tests/ProvidersTests/Resources
  - .build
  - .swiftpm
  - "**/.build"
  - "**/.swiftpm"
  # Imported example app — uses its own style. `--force-exclude` in the
  # pre-commit hook honors this list when the app's files are staged.
  - Examples/RealtimeVoiceAgent

# 4-space indentation is enforced by `.editorconfig` (read by Xcode and most
# editors) and by running `swiftformat --indent 4` locally before committing.
# SwiftLint's `indentation_width` rule is not enabled — it rejects the standard
# multi-line condition continuation style (alignment with first condition past
# `if `/`guard `), which is widely used and not worth reformatting away.

# Match Xcode's default "Indent switch statement `case` labels in" setting —
# cases are indented one level past the `switch` keyword, body two levels.
switch_case_alignment:
  indented_cases: true

identifier_name:
  # Names allowed because renaming would either break public API or lose
  # protocol-level meaning:
  #   - `n`: OpenAI's parameter name for "number of completions" on every
  #     `createChatCompletion` signature and the Image Generation request.
  #   - `id`: standard short name for object identifiers.
  #   - `k`: the Reciprocal Rank Fusion rank constant (RankFusion.swift).
  #   - `e5`: the intfloat/e5 embedding model family (instruction-prefix template).
  #   - `eq`/`ne`/`gt`/`lt`/`or`: OpenAI's vector store search filter operators
  #     (`VectorStoreFilter` cases mirror the documented wire names).
  excluded:
    - id
    - n
    - k
    - e5
    - eq
    - ne
    - gt
    - lt
    - or

# Doc comments wrap differently from code and shouldn't count against the
# 120-char code line limit. URLs in comments are common (e.g. links to the
# OpenAI API reference) and natural to keep on one line.
line_length:
  ignores_comments: true
  ignores_urls: true

# Provider API model files mirror the real-world JSON structure of the
# upstream APIs (OpenAI / Gemini / Ollama). Nested types like
# `Part.FileData` and their accompanying `CodingKeys` are a standard Swift
# idiom for that — the default `type_level: 1` is too strict to express it
# cleanly. Bumping the threshold rather than littering
# `// swiftlint:disable:next nesting` across every Codable model.
nesting:
  type_level: 3

# Structural thresholds — the OpenAI / Google / Ollama API clients are
# inherently large because each provider exposes a dozen-plus endpoints with
# rich parameter surface, and the agent runtime contains state machines
# (Runner, RealtimeSession event router, Responses stream decoder) that are
# clearer as one linear function than as a fan-out of helpers. The defaults
# (file 400 / type 250 / func 50 / complexity 10) were written for app
# code, not API-client libraries. These thresholds are roughly 3× the
# defaults — still strict enough to catch new bloat, lenient enough to
# express the existing shape.
file_length:
  warning: 800
  error: 1200
type_body_length:
  warning: 700
  error: 900
function_body_length:
  warning: 300
  error: 500
cyclomatic_complexity:
  warning: 45
  error: 60
function_parameter_count:
  warning: 12
  error: 20
